app = "roostr-relay"
primary_region = "sjc"

[build]
  [build.args]
    VERIFY_DUAL = "true" # Production soak: both verifiers must agree before acceptance.

[env]
  PORT = "7777"
  DB_PATH = "/data/relay.db"
  RELAY_NAME = "RoostrRelay"
  RELAY_DESCRIPTION = "A Nostr relay in Odin backing Roostr sync."

[[mounts]]
  source = "relay_data"
  destination = "/data"

[[services]]
  internal_port = 7777
  protocol = "tcp"
  auto_stop_machines = false       # idle websockets get reaped otherwise
  auto_start_machines = false
  min_machines_running = 1

  [services.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
